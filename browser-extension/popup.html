<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 메신저</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="loginPanel" class="login-panel">
    <section class="login-card">
        <h1>오프라인 메신저</h1>
        <label>서버 주소 <input id="serverUrl" value="http://localhost:8080" autocomplete="off"></label>
        <label>아이디 <input id="loginId" autocomplete="username"></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password"></label>
        <label>닉네임 <input id="displayName" placeholder="회원가입할 때만 입력"></label>
        <div class="button-row">
            <button id="loginButton" type="button">로그인</button>
            <button id="registerButton" type="button" class="secondary">회원가입</button>
        </div>
    </section>
</div>

<div id="app" class="app hidden">
    <aside>
        <section class="profile">
            <div class="profile-head">
                <button id="profileToggle" class="profile-summary" type="button" aria-expanded="false">
                    <div id="myAvatar" class="avatar avatar-aurora"></div>
                    <div>
                        <strong id="myDisplayName"></strong>
                        <span id="myLoginId" class="small"></span>
                    </div>
                </button>
                <button id="refreshRoomsButton" class="refresh-button" type="button" title="새로고침">↻</button>
            </div>
            <div id="profileDetails" class="profile-details hidden">
                <label>서버 <input id="serverUrlInApp" autocomplete="off"></label>
                <label>닉네임 <input id="nicknameInput"></label>
                <div class="avatar-picker" id="avatarPicker" aria-label="프로필 아이콘 선택"></div>
                <div class="custom-color-row">
                    <input id="avatarColorInput" type="color" value="#6d6af2" title="프로필 색상 선택">
                    <input id="avatarHexInput" placeholder="#6D6AF2" maxlength="7" autocomplete="off">
                </div>
                <label class="toggle-row">
                    <input id="notificationToggle" type="checkbox">
                    메시지 알림
                </label>
                <div class="button-row compact">
                    <button id="changeNicknameButton" type="button">변경</button>
                    <button id="logoutButton" type="button" class="secondary">로그아웃</button>
                </div>
            </div>

            <div class="rooms-panel">
                <div class="section-title">
                    <h2>내 방 목록</h2>
                    <span id="roomCount" class="small"></span>
                </div>
                <div id="rooms" class="rooms"></div>
            </div>
        </section>

        <section class="collapsible">
            <button id="roomCreateToggle" class="collapse-toggle" type="button" aria-expanded="false">
                <span>방 만들기</span>
                <span id="roomCreateArrow" class="collapse-arrow" aria-hidden="true"></span>
            </button>
            <div id="roomCreatePanel" class="collapse-panel hidden">
                <input id="roomName" placeholder="방 이름">
                <select id="roomType">
                    <option value="GROUP">단체방</option>
                    <option value="PRIVATE">개인방</option>
                </select>
                <input id="roomMemberSearchKeyword" placeholder="초대할 사용자 검색">
                <select id="roomMemberSelect" size="4"><option value="">사용자 선택</option></select>
                <div class="button-row compact">
                    <button id="addRoomMemberCandidateButton" type="button">선택 추가</button>
                    <button id="bulkAddRoomMembersButton" type="button" class="secondary">검색 결과 일괄추가</button>
                </div>
                <button id="clearRoomMemberCandidatesButton" type="button" class="ghost">초대 목록 비우기</button>
                <div id="roomMemberCandidates" class="candidate-box"></div>
                <button id="createRoomButton" type="button">방 생성</button>
            </div>
        </section>
    </aside>

    <main>
        <header class="room-header">
            <div class="room-info-row">
                <div class="room-title-block">
                    <strong id="currentRoomTitle">방을 선택하세요</strong>
                    <div id="memberList" class="small"></div>
                </div>
                <button id="roomActionToggle" class="room-action-toggle hidden" type="button" aria-expanded="false" title="방 메뉴"></button>
            </div>
            <div id="roomActions" class="room-actions hidden">
                <button id="renameRoomButton" type="button" class="outline">이름변경</button>
                <button id="leaveRoomButton" type="button" class="outline">나가기</button>
                <button id="toggleMemberAddButton" type="button">참여자추가</button>
            </div>

            <div id="memberAddPanel" class="member-add-row hidden">
                <input id="userSearchKeyword" placeholder="추가할 사용자 검색">
                <select id="addMemberSelect" size="3"><option value="">사용자 선택</option></select>
                <button id="addMemberButton" type="button">추가</button>
            </div>
        </header>

        <div id="messages" class="messages"></div>

        <footer class="sendbox">
            <textarea id="messageInput" placeholder="메시지 입력"></textarea>
            <button id="sendMessageButton" type="button">전송</button>
            <input id="fileInput" type="file">
            <button id="uploadFileButton" type="button" class="outline" title="파일 첨부">첨부</button>
        </footer>
    </main>
</div>

<script src="vendor/sockjs.min.js"></script>
<script src="vendor/stomp.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
