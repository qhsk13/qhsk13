<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메신저</title>
    <meta name="theme-color" content="#6d6af2">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script src="/code-format.js"></script>
</head>
<body>
<div id="loginPanel" class="login-panel">
    <div class="login-card">
        <h2>메신저 로그인</h2>
        <input id="loginId" placeholder="아이디">
        <input id="password" type="password" placeholder="비밀번호">
        <input id="displayName" placeholder="닉네임(회원가입 시)">
        <div class="row">
            <button onclick="login()">로그인</button>
            <button onclick="register()">회원가입</button>
        </div>
    </div>
</div>

<div id="app" class="app hidden">
    <aside>
        <div class="profile">
            <button id="profileToggle" class="profile-head" type="button" onclick="toggleProfileDetails()">
                <div id="myAvatar" class="avatar avatar-aurora"></div>
                <div>
                    <b id="myDisplayName"></b>
                    <span class="small" id="myLoginId"></span>
                </div>
            </button>
            <button id="refreshRoomsButton" class="refresh-button" type="button" onclick="loadRooms()" title="새로고침">↻</button>
            <div id="profileDetails" class="profile-details hidden">
                <input id="nicknameInput" placeholder="새 닉네임">
                <div class="avatar-picker" id="avatarPicker" aria-label="프로필 아이콘 선택"></div>
                <div class="custom-color-row">
                    <input id="avatarColorInput" type="color" value="#6d6af2" title="프로필 색상 선택">
                    <input id="avatarHexInput" placeholder="#6D6AF2" maxlength="7" autocomplete="off">
                </div>
                <button onclick="changeNickname()">변경</button>
                <button onclick="logout()" class="secondary">로그아웃</button>
            </div>
        </div>

        <section class="rooms-panel">
            <div class="section-title">
                <h3>내 방 목록</h3>
                <span id="roomCount" class="small"></span>
            </div>
            <div id="rooms" class="rooms"></div>
        </section>

        <section class="collapsible">
            <button id="roomCreateToggle" class="collapse-toggle" type="button" onclick="toggleRoomCreatePanel()" aria-expanded="false">
                <span>방 만들기</span>
                <span id="roomCreateArrow" class="collapse-arrow" aria-hidden="true"></span>
            </button>
            <div id="roomCreatePanel" class="collapse-panel hidden">
                <input id="roomName" placeholder="방 이름">
                <select id="roomType">
                    <option value="GROUP">단체방</option>
                    <option value="PRIVATE">개인방</option>
                </select>
                <input id="roomMemberSearchKeyword" placeholder="초대할 사용자 ID/닉네임 검색" oninput="searchUsersForRoom()">
                <select id="roomMemberSelect" size="3">
                    <option value="">사용자 선택</option>
                </select>
                <button onclick="addRoomMemberCandidate()">초대 목록에 추가</button>
                <div id="roomMemberCandidates" class="candidate-box"></div>
                <button onclick="createRoom()">방 생성</button>
            </div>
        </section>
    </aside>

    <main>
        <div class="room-header">
            <div class="room-info-row">
                <div class="room-title-block">
                    <strong id="currentRoomTitle">방을 선택하세요</strong>
                    <div class="small" id="memberList"></div>
                </div>
                <button id="roomActionToggle" class="room-action-toggle hidden" type="button" onclick="toggleRoomActions()" aria-expanded="false" title="방 메뉴"></button>
            </div>
            <div id="roomActions" class="room-actions hidden">
                <button onclick="renameRoom()" class="outline">이름변경</button>
                <button onclick="leaveRoom()" class="outline">나가기</button>
                <button onclick="toggleMemberAddPanel()">참여자추가</button>
            </div>

            <div id="memberAddPanel" class="member-add-row hidden">
                <span class="field-label">사용자 추가</span>
                <input id="userSearchKeyword" placeholder="ID/닉네임 검색" oninput="searchUsersForAdd()">
                <select id="addMemberSelect" size="3">
                    <option value="">사용자 선택</option>
                </select>
                <button onclick="addMember()">추가</button>
            </div>
        </div>
        <div id="messages"></div>
        <div class="sendbox">
            <textarea id="messageInput" placeholder="메시지 입력 (코드는 [코드] 버튼으로 언어를 선택해 넣거나, 그대로 붙여넣으면 자동 서식이 적용됩니다)"></textarea>
            <button onclick="sendMessage()">전송</button>
            <select id="codeLangSelect" title="코드 언어 선택 (기본: 자동감지)">
                <option value="">자동감지</option>
                <option value="java">Java</option>
                <option value="jsp">JSP</option>
                <option value="html">HTML</option>
                <option value="xml">XML</option>
                <option value="markdown">Markdown</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="json">JSON</option>
                <option value="sql">SQL</option>
                <option value="python">Python</option>
                <option value="bash">Shell</option>
                <option value="yaml">YAML</option>
                <option value="properties">Properties</option>
                <option value="plaintext">Text(서식없음)</option>
            </select>
            <button id="insertCodeButton" onclick="insertCodeBlock()" class="outline" title="선택한 언어로 코드 블록 삽입">코드</button>
            <input id="fileInput" type="file">
            <button id="uploadFileButton" onclick="chooseFile()" class="outline" title="파일 첨부">첨부</button>
        </div>
    </main>
</div>

<script src="/vendor/sockjs.min.js"></script>
<script src="/vendor/stomp.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
