# Embedded H2 file DB with PostgreSQL compatibility mode.
# This is not PostgreSQL itself, but it is useful when you want PostgreSQL-like SQL behavior
# without running a separate DB server in a closed network.
spring.datasource.url=jdbc:h2:file:./data/messenger-pgmode;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
